<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hairfall Stage Determiner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    .upload-area {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 1.75rem 1rem;
      cursor: pointer;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .upload-area:hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.05);
    }

    .upload-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .upload-text {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .preview-img {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      background: #000;
    }

    .btn {
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover:not(:disabled) {
      background: #4338ca;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      margin-top: 1.25rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    /* Result Box - Only Stage and Confidence */
    .result-box {
      display: none;
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      font-size: 1rem;
    }

    .result-label {
      color: #94a3b8;
    }

    .result-value {
      font-weight: 700;
      color: #ffffff;
    }

    .stage-highlight {
      color: #818cf8;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hairfall Stage Determiner</h1>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="onFileSelected(event)">

    <!-- Upload area -->
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📷</div>
      <div class="upload-text" id="uploadText">Click to select an image</div>
    </div>

    <!-- Image preview -->
    <img id="previewImage" class="preview-img" alt="Preview">

    <!-- Submit button -->
    <button class="btn" id="btnPredict" onclick="predictStage()" disabled>Predict Stage</button>

    <!-- Loading message -->
    <div class="loading" id="loading">Processing image...</div>

    <!-- Result: ONLY Stage and Confidence % -->
    <div class="result-box" id="resultBox">
      <div class="result-row">
        <span class="result-label">Stage:</span>
        <span class="result-value stage-highlight" id="resStage">-</span>
      </div>
      <div class="result-row">
        <span class="result-label">Confidence:</span>
        <span class="result-value" id="resConfidence">-</span>
      </div>
    </div>
  </div>

  <script>
    let selectedFile = null;

    function onFileSelected(e) {
      if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = document.getElementById("previewImage");
          img.src = evt.target.result;
          img.style.display = "block";
          document.getElementById("uploadArea").style.display = "none";
          document.getElementById("btnPredict").disabled = false;
          document.getElementById("resultBox").style.display = "none";
        };
        reader.readAsDataURL(selectedFile);
      }
    }

    async function predictStage() {
      if (!selectedFile) return;

      const btn = document.getElementById("btnPredict");
      const loading = document.getElementById("loading");
      const resultBox = document.getElementById("resultBox");

      btn.disabled = true;
      loading.style.display = "block";
      resultBox.style.display = "none";

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const response = await fetch("/predict-stage", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail || "Failed to get prediction");
        }

        const data = await response.json();
        document.getElementById("resStage").innerText = data.stage;
        document.getElementById("resConfidence").innerText = data.confidence + "%";
        resultBox.style.display = "block";
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        loading.style.display = "none";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
