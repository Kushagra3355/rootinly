version: "3.8"

services:
  rootinly-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rootinly_crown_analysis
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - YOLO_CONFIDENCE=0.5
      - MODEL_PATH=/app/models/best.pt
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    restart: unless-stopped
